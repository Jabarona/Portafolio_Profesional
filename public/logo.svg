<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Marco principal cuadrado redondeado (centrado en 200,200) -->
  <rect x="25" y="25" width="350" height="350" rx="80" fill="#060e20" stroke="#00e5ff" stroke-width="8" />
  
  <!-- Borde interior punteado -->
  <rect x="40" y="40" width="320" height="320" rx="65" fill="none" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="12 12" />

  <defs>
    <!-- Patrón de circuito impreso para la "B" -->
    <pattern id="pcb" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="60" height="60" fill="#060e20" />
      <path d="M -10 20 H 15 L 25 30 H 45 A 5 5 0 0 0 50 25 V -10" stroke="#00e5ff" stroke-width="2.5" fill="none" />
      <path d="M 15 70 V 45 L 30 30" stroke="#00e5ff" stroke-width="2.5" fill="none" />
      <path d="M 70 40 H 45 L 35 50 V 70" stroke="#00e5ff" stroke-width="2.5" fill="none" />
      <path d="M 0 0 L 10 10 V 20" stroke="#00e5ff" stroke-width="2" fill="none" />
      <circle cx="15" cy="20" r="4.5" fill="#00e5ff" />
      <circle cx="45" cy="30" r="4.5" fill="#060e20" stroke="#00e5ff" stroke-width="2" />
      <circle cx="50" cy="25" r="4.5" fill="#00e5ff" />
      <circle cx="15" cy="45" r="4.5" fill="#00e5ff" />
      <circle cx="30" cy="30" r="5.5" fill="#00e5ff" />
      <circle cx="45" cy="40" r="4.5" fill="#00e5ff" />
      <circle cx="35" cy="50" r="4.5" fill="#060e20" stroke="#00e5ff" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Agrupamos el logo, lo reducimos y lo centramos exactamente -->
  <g transform="translate(61, 42) scale(0.75)">
    <!-- La letra "J" base en color claro -->
    <path d="M 140 80 H 180 V 250 A 60 60 0 0 1 60 250 V 230 H 100 V 250 A 20 20 0 0 0 140 250 Z" fill="#dae2fd" />
    
    <!-- Partículas y desintegración de la "J" -->
    <rect x="50" y="200" width="14" height="14" fill="#dae2fd" />
    <rect x="30" y="220" width="14" height="14" fill="#dae2fd" />
    <rect x="70" y="210" width="14" height="14" fill="#dae2fd" />
    <rect x="40" y="240" width="14" height="14" fill="#dae2fd" />
    <rect x="55" y="260" width="14" height="14" fill="#dae2fd" />
    <rect x="20" y="270" width="14" height="14" fill="#dae2fd" />
    <rect x="75" y="275" width="14" height="14" fill="#dae2fd" />
    <rect x="50" y="290" width="14" height="14" fill="#dae2fd" />
    <rect x="95" y="285" width="14" height="14" fill="#dae2fd" />
    <rect x="65" y="310" width="14" height="14" fill="#dae2fd" />
    <rect x="110" y="300" width="14" height="14" fill="#dae2fd" />
    <rect x="85" y="325" width="14" height="14" fill="#dae2fd" />
    <rect x="125" y="315" width="14" height="14" fill="#dae2fd" />
    <rect x="105" y="335" width="14" height="14" fill="#dae2fd" />
    <rect x="25" y="205" width="7" height="7" fill="#dae2fd" />
    <rect x="45" y="225" width="7" height="7" fill="#dae2fd" />
    <rect x="20" y="250" width="7" height="7" fill="#dae2fd" />
    <rect x="90" y="255" width="7" height="7" fill="#dae2fd" />
    <rect x="35" y="295" width="7" height="7" fill="#dae2fd" />
    <rect x="80" y="340" width="7" height="7" fill="#dae2fd" />
    <rect x="140" y="330" width="7" height="7" fill="#dae2fd" />
    <rect x="110" y="270" width="10" height="10" fill="#dae2fd" />
    <rect x="80" y="230" width="8" height="8" fill="#dae2fd" />
    <rect x="130" y="290" width="12" height="12" fill="#dae2fd" />

    <!-- La letra "B" con el estilo placa de circuito impreso y color cyan -->
    <text x="175" y="310" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="290" fill="url(#pcb)" stroke="#00e5ff" stroke-width="9" letter-spacing="-0.05em">B</text>
  </g>
</svg>
